---
# IMPORTANT: Replace all placeholder values with your actual configuration
# This manifest file needs to be customized for your environment

applications:
  # Main application - Work Order Service
  - name: work-order-service
    path: .
    buildpacks:
      - https://github.com/cloudfoundry/nodejs-buildpack
    memory: 512M
    # Replace with your actual route from Cloud Foundry
    routes:
      - route: <your-app-name>.cfapps.<region>.hana.ondemand.com
    instances: 1
    command: npm run start:prod
    # Replace service names with your actual BTP service instances
    services:
      - <your-hana-db-instance>      # BTP HANA service instance name
      - <your-xsuaa-instance>         # BTP XSUAA service instance name
      - <your-destination-instance>   # BTP Destination service instance name
    env:
      # Analytics Integration (optional)
      # Maps each SSC tenant hostname to its analytics source ID and BTP destination
      # Remove or leave empty if not using analytics
      # Format: { "<ssc-tenant-hostname>": { "sourceId": "<analytics-source-id>", "destination": "<btp-destination-name>" } }
      TENANT_CONFIG_MAP: >
        {
          "<your-ssc-tenant-hostname>": { "sourceId": "<your-analytics-source-id>", "destination": "<your-analytics-destination>" }
        }
    timeout: 300

  # Application Router for authentication
  - name: work-order-approuter
    # Replace with your actual approuter route
    routes:
      - route: <your-approuter-name>.cfapps.<region>.hana.ondemand.com
    path: approuter
    buildpacks:
      - nodejs_buildpack
    memory: 128M
    services:
      - <your-xsuaa-instance>         # Same XSUAA instance as above
    env:
      # Update the URL to match your main application route
      destinations: >
        [
          {"name":"work-order-destination",
          "url":"https://<your-app-name>.cfapps.<region>.hana.ondemand.com",
          "forwardAuthToken": true}
        ]
      COOKIES: >
        { "SameSite":"None" }
